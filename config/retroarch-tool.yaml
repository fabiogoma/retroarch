# RetroArch tool configuration.
# Put personal/machine-specific overrides (like your Apple TV IP) in
# config/retroarch-tool.local.yaml (gitignored), or override via RETROARCH_<NAME>
# environment variables or CLI flags.

# --- RetroArch device ---
server: http://192.168.0.249        # RetroArch web file server URL on Apple TV
device_home: "~"                    # RetroArch home alias used in playlist paths
remote_rom_root: [downloads, ROMS]  # Remote ROM directory on the device
remote_playlists_dir: playlists     # Remote playlists directory
remote_thumbnails_dir: thumbnails   # Remote thumbnails (artwork) directory
remote_overlays_dir: [overlays, console-bezels] # Remote bezel overlays directory
remote_config_dir: config           # Remote config directory

# --- Local folders (relative to project root unless absolute) ---
roms_dir: ROMs                      # Source ROMs folder
artwork_dir: artwork                # Downloaded box art folder
config_dir: config                  # All custom configuration (curation, cores, bezels, RetroArch cfg)
bezel_dir: config/bezels            # Downloaded console bezels & overrides
state_dir: state                    # Runtime scan cache & lock files (gitignored)
backup_dir: state/config-backups    # Pre-sync backups of running device config (gitignored)

# --- Build & sync behavior ---
top: "30,40,50,60,70,80,90,100"     # Top sets generated by `build`
sync_top: 50                        # Default Top set used by `artwork` and `sync`
export_prefix: AppleTV-Top          # Export folder name is <export_prefix><count>
unzip: false                        # Extract single-ROM ZIP archives into exports

# --- Concurrency & network ---
workers: 4                          # Default parallel goroutines for artwork & sync
artwork_workers: 8                  # Parallel goroutines for `artwork` downloads (0 = use workers)
sync_workers: 4                     # Parallel goroutines for `sync` uploads (0 = use workers)
connect_timeout: 30s
response_timeout: 120s
user_agent: RetroArchAppleTV/1.0
artwork_api_base: https://api.github.com
artwork_raw_base: https://raw.githubusercontent.com

