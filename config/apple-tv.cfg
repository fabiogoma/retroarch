# Merge these settings into the current device config after backing it up.
# This is a portable settings fragment, not a full replacement config.
# Based on the existing Apple TV setup; gameplay still requires device testing.
audio_driver = "coreaudio"
audio_out_rate = "48000"
audio_resampler = "sinc"
audio_resampler_quality = "4"
audio_latency = "192"
audio_volume = "-3.000000"
audio_sync = "true"
audio_rate_control = "true"
rewind_enable = "false"
log_verbosity = "false"
log_to_file = "false"
config_save_on_exit = "false"
video_driver = "vulkan"
video_vsync = "true"
video_refresh_rate = "60.000000"
video_scale_integer = "false"
aspect_ratio_index = "0"
video_smooth = "false"
video_shader_enable = "true"
auto_overrides_enable = "true"
input_overlay_enable = "false"
input_driver = "cocoa"
input_joypad_driver = "mfi"
input_player1_analog_dpad_mode = "1"
input_player2_analog_dpad_mode = "1"
