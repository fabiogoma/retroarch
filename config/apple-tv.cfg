# Apple TV RetroArch settings merged into /config/retroarch.cfg during sync.
# Unrelated device settings are preserved.
audio_driver = "coreaudio"
audio_out_rate = "48000"
audio_resampler = "sinc"
audio_resampler_quality = "4"
audio_latency = "192"
audio_volume = "-3.000000"
audio_sync = "true"
audio_rate_control = "true"
rewind_enable = "false"
log_verbosity = "false"
log_to_file = "false"
config_save_on_exit = "false"
video_driver = "vulkan"
video_vsync = "true"
video_refresh_rate = "60.000000"
video_scale_integer = "false"
aspect_ratio_index = "0"
video_smooth = "false"
video_shader_enable = "true"
auto_overrides_enable = "true"
auto_remaps_enable = "true"
input_overlay_enable = "false"

# Two original Sony DualShock 4 controllers over Apple TV MFi.
# Left analog stick acts as D-pad on D-pad-only consoles; N64 overrides this to "0".
input_driver = "cocoa"
input_joypad_driver = "mfi"
input_autodetect_enable = "true"
input_max_users = "2"
input_player1_joypad_index = "0"
input_player2_joypad_index = "1"
input_libretro_device_p1 = "1"
input_libretro_device_p2 = "1"
input_player1_analog_dpad_mode = "1"
input_player2_analog_dpad_mode = "1"
