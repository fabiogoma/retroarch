# Console bezel and DualShock 4 settings for the matching ROM folder.
input_overlay = "~/Library/Caches/RetroArch/overlays/console-bezels/master-system.cfg"
input_overlay_enable = "true"
input_overlay_enable_autopreferred = "false"
input_overlay_auto_scale = "false"
input_overlay_auto_rotate = "false"
input_overlay_opacity = "1.000000"
input_overlay_hide_when_gamepad_connected = "false"
input_overlay_hide_in_menu = "true"
input_overlay_pointer_enable = "false"
input_player1_analog_dpad_mode = "1"
input_player2_analog_dpad_mode = "1"
